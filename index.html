<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahmed Fayez</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#000;display:flex;justify-content:center;padding:0}
.phone{width:100%;max-width:430px;min-height:100vh;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;color:#fff;background:#071226}
.bg-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.overlay{position:absolute;inset:0;background:linear-gradient(to bottom, rgba(7,18,38,.45), rgba(7,18,38,.55) 45%, rgba(7,18,38,.92));z-index:1}
.profile,h1,.links{position:relative;z-index:2}
.profile{margin-top:28px}
.profile img{width:215px;height:215px;object-fit:cover;object-position:top center;border-radius:50%;border:5px solid #d4af37;box-shadow:0 0 0 5px rgba(7,18,38,.8),0 15px 35px rgba(0,0,0,.6);background:#222}
h1{font-size:38px;font-weight:800;margin-top:22px;text-shadow:0 2px 10px rgba(0,0,0,.7)}
/* الأزرار تحت بعض */
.links{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px;margin-top:32px;padding-bottom:30px}
.links a{height:60px;background:#0f2340;border:1.5px solid #d4af37;border-radius:15px;display:flex;align-items:center;justify-content:center;gap:12px;color:#fff;text-decoration:none;font-size:19px;font-weight:800;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.links a:active{background:#d4af37;color:#071226}
.links img{width:28px;height:28px;object-fit:contain}
.follow-btn{background:#d4af37 !important;color:#071226 !important;border-color:#d4af37 !important}
</style>
</head>
<body>
<div class="phone">
  <!-- الفيديو شغال -->
  <video class="bg-video" id="bgVideo" autoplay muted loop playsinline preload="auto" poster="IMG-20261127-WA0003.jpg">
    <source src="VID-20261127-WA0006.mp4" type="video/mp4">
  </video>
  <div class="overlay"></div>

  <div class="profile">
    <img src="IMG-20261127-WA0003.jpg" alt="Ahmed Fayez">
  </div>

  <h1>Ahmed Fayez</h1>

  <!-- الأزرار كلها تحت بعض -->
  <div class="links">
    <a href="https://instagram.com/_a7me5_soliman" target="_blank">
      <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="Instagram"> Instagram
    </a>
    <a href="https://www.facebook.com/share/1DU1NDY21w/" target="_blank">
      <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook"> Facebook
    </a>
    <a href="https://www.tiktok.com/@ahmed.fayez516" target="_blank">
      <img src="https://cdn-icons-png.flaticon.com/512/3046/3046126.png" alt="TikTok"> TikTok
    </a>
    <a href="https://t.me/+201271357222" target="_blank">
      <img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png" alt="Telegram"> Telegram
    </a>
    <a href="https://wa.me/201271357222" target="_blank">
      <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png" alt="WhatsApp"> WhatsApp
    </a>
    <a class="follow-btn" href="https://instagram.com/_a7me5_soliman" target="_blank">Follow</a>
  </div>
</div>

<script>
// تشغيل الفيديو غصب عنه حتى لو الموبايل منعه
var v = document.getElementById('bgVideo');
v.muted = true;
v.play().catch(function(){});
document.addEventListener('click', function(){
  if(v.paused){ v.play(); }
},{once:true});
document.addEventListener('touchstart', function(){
  if(v.paused){ v.play(); }
},{once:true});
</script>
</body>
</html>
